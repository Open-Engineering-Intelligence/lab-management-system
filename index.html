<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">L</div>
      <div><div class="brand-name">实验室综合管理系统</div><div class="brand-sub">Lab Resource &amp; Flow Hub</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="dot"></span><span id="saveState">本地数据 · 自动保存</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" title="菜单"><svg class="icon"><use href="#i-menu"/></svg></button>
      <div class="crumb" id="crumb">总览</div>
      <div class="top-actions">
        <div class="search-wrap">
          <svg class="icon search-icon"><use href="#i-search"/></svg>
          <input id="globalSearch" type="search" placeholder="搜索成员 / 项目 / 物品 / 信息" autocomplete="off">
          <div class="search-panel" id="searchPanel"></div>
        </div>
        <button class="btn primary" data-action="quick-add"><svg class="icon"><use href="#i-plus"/></svg>新建</button>
        <span class="role-badge user" id="roleBadge" title="角色权限">普通用户</span>
        <div class="user-chip" id="userChip" title="当前用户（在设置中修改）"></div>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
